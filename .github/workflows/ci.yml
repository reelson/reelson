name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Typecheck + unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Install ffmpeg (the voice-over tests speak and trim a line)
              run: sudo apt-get update && sudo apt-get install -y ffmpeg
            - run: npm run typecheck
            - run: npm test
            - name: The npm package installs and runs (compiled, from under node_modules)
              run: |
                  npm pack
                  npm install -g ./reelson-*.tgz
                  mkdir -p "$RUNNER_TEMP/project"
                  reelson install "$RUNNER_TEMP/project" --no-browser
                  cd "$RUNNER_TEMP/project" && reelson new hello && reelson templates

    smoke:
        name: Verify → record → build → check (example, every take)
        needs: test
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22
                  cache: npm
            - name: Install ffmpeg
              run: sudo apt-get update && sudo apt-get install -y ffmpeg
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - name: Verify the committed takes still record and fit video.json
              run: npm run example:verify
            - name: Record the TodoMVC example (desktop, phone and square takes)
              run: npm run example:record
            - name: Build the composition from video.json
              run: npm run example:build
            - name: Check (schemas, zoom timing, hyperframes lint)
              run: npm run example:check
            - name: Keep the built example for the render jobs
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: example-built
                  path: |
                      examples/todo-add-item/
                      !examples/todo-add-item/.raw*
            - name: Upload a failed take
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: example-failed-take
                  path: examples/todo-add-item/recording*.failed.*
                  if-no-files-found: ignore

    render:
        name: Render (${{ matrix.format }})
        needs: smoke
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { format: landscape, suffix: '', size: '1920,1080' }
                    - { format: portrait, suffix: .portrait, size: '1080,1920' }
                    - { format: square, suffix: .square, size: '1080,1080' }
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22
                  cache: npm
            - name: Install ffmpeg
              run: sudo apt-get update && sudo apt-get install -y ffmpeg
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: example-built
                  path: examples/todo-add-item/
            - name: Render the ${{ matrix.format }} version
              run: cd examples && node ../bin/reelson.ts render todo-add-item --only ${{ matrix.format }} --no-build
            - name: Verify the render
              run: |
                  out=examples/todo-add-item/video/renders/todo-add-item${{ matrix.suffix }}.mp4
                  duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$out")
                  size=$(ffprobe -v error -select_streams v -show_entries stream=width,height -of csv=p=0 "$out")
                  echo "${{ matrix.format }}: ${duration}s, $size"
                  awk -v d="$duration" 'BEGIN { exit !(d > 15 && d < 40) }'
                  test "$size" = "${{ matrix.size }}"
                  mkdir -p frames
                  for t in 0 2 8 13; do ffmpeg -y -loglevel error -ss "$t" -i "$out" -frames:v 1 -vf scale=-2:540 "frames/t$t.jpg"; done
            - name: Upload the render and frames
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: example-render-${{ matrix.format }}
                  path: |
                      examples/todo-add-item/video/renders/
                      frames/
                  if-no-files-found: ignore

    demo:
        # The README clip: cut from this push's landscape render and swapped into the rolling "demo"
        # pre-release (github.com/reelson/reelson/releases/download/demo/demo.webp) — no commit, no
        # package bloat. Only for pushes to main; the one job here that may write (release assets).
        name: README clip (rolling "demo" release)
        needs: render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: example-render-landscape
            - name: Install ffmpeg
              run: sudo apt-get update && sudo apt-get install -y ffmpeg
            - name: Cut the clip (960 px animated WebP)
              run: |
                  ffmpeg -y -loglevel error -i examples/todo-add-item/video/renders/todo-add-item.mp4 \
                      -vf fps=15,scale=960:-2:flags=lanczos -c:v libwebp -quality 70 -compression_level 6 -loop 0 -an demo.webp
                  ls -l demo.webp
            - name: Replace the asset on the "demo" pre-release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  gh release view demo >/dev/null 2>&1 || gh release create demo --prerelease --latest=false \
                      --target "$GITHUB_SHA" --title "README demo (rolling)" \
                      --notes "The README clip, re-rendered by CI on every push to main. Not a version of reelson."
                  gh release upload demo demo.webp --clobber
                  gh release edit demo --notes "The README clip, re-rendered by CI from $GITHUB_SHA. Not a version of reelson."
