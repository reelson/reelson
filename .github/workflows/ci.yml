name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Typecheck + unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm test

    smoke:
        name: Verify → record → build → check → render (example, every format)
        needs: test
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - name: Install ffmpeg
              run: sudo apt-get update && sudo apt-get install -y ffmpeg
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - name: Verify the committed takes still record and fit video.json
              run: npm run example:verify
            - name: Record the TodoMVC example (desktop, phone and square takes)
              run: npm run example:record
            - name: Build the composition from video.json
              run: npm run example:build
            - name: Check (schemas, zoom timing, hyperframes lint)
              run: npm run example:check
            - name: Render (landscape, portrait, square)
              run: npm run example:render
            - name: Verify the renders
              run: |
                  mkdir -p frames
                  for version in "" .portrait .square; do
                      out=examples/todo-add-item/video/renders/todo-add-item$version.mp4
                      duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$out")
                      size=$(ffprobe -v error -select_streams v -show_entries stream=width,height -of csv=p=0 "$out")
                      echo "todo-add-item$version: ${duration}s, $size"
                      awk -v d="$duration" 'BEGIN { exit !(d > 15 && d < 40) }'
                      for t in 0 2 8 13; do ffmpeg -y -loglevel error -ss "$t" -i "$out" -frames:v 1 -vf scale=-2:540 "frames/t$t$version.jpg"; done
                  done
                  test "$(ffprobe -v error -select_streams v -show_entries stream=width,height -of csv=p=0 examples/todo-add-item/video/renders/todo-add-item.portrait.mp4)" = "1080,1920"
                  test "$(ffprobe -v error -select_streams v -show_entries stream=width,height -of csv=p=0 examples/todo-add-item/video/renders/todo-add-item.square.mp4)" = "1080,1080"
            - name: Upload the render and frames
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: example-render
                  path: |
                      examples/todo-add-item/video/renders/
                      examples/todo-add-item/recording*.failed.*
                      frames/
                  if-no-files-found: ignore
