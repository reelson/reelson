name: Publish

# Publishes to npm when a vX.Y.Z tag is pushed, through npm trusted publishing (OIDC): no npm token
# exists anywhere. One-time setup on npmjs.com → reelson → Settings → Trusted publishing:
# GitHub Actions, reelson / reelson, workflow publish.yml, environment npm.
#
# Hardening: actions pinned to commit SHAs (Dependabot bumps them), npm pinned, dependencies
# installed without their install scripts, no shared cache, no token left in the checkout, and
# the job runs in the `npm` environment — give it a required reviewer (GitHub → Settings →
# Environments) and each publish waits for that approval.
on:
    push:
        tags: ['v*']

permissions: {}

concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
            # Trusted publishing needs npm 11.5.1+; pinned so a new npm release cannot change the publish.
            - run: npm install -g npm@11.20.0
            # No dependency needs an install script; skipping them keeps a compromised one from running here.
            - run: npm ci --ignore-scripts
            - name: The tag matches package.json
              run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
            # prepublishOnly runs the type check and tests (CI ran the ffmpeg ones on this commit);
            # prepack compiles. Provenance is added by trusted publishing once the repository is public.
            - run: npm publish --access public
