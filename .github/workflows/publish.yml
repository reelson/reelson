name: Publish

# Stages a release on npm when a vX.Y.Z tag is pushed, through npm trusted publishing (OIDC): no
# npm token exists anywhere. The staged version goes live only once a maintainer approves it with
# 2FA — `npm stage list reelson`, then `npm stage approve <id>` (or on npmjs.com) — so neither a
# compromised GitHub account nor CI can release on its own. One-time setup on npmjs.com → reelson →
# Settings → Trusted publisher: GitHub Actions, reelson / reelson, publish.yml, environment npm,
# "Allow npm publish" left off (the publisher may only stage).
#
# Hardening: actions pinned to commit SHAs (Dependabot bumps them), npm pinned, dependencies
# installed without their install scripts, no shared cache, no token left in the checkout, and
# the job runs in the `npm` environment — give it a required reviewer (GitHub → Settings →
# Environments) and each publish waits for that approval.
on:
    push:
        tags: ['v*']

permissions: {}

concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
            # Trusted publishing needs npm 11.5.1+; pinned so a new npm release cannot change the publish.
            - run: npm install -g npm@11.20.0
            # No dependency needs an install script; skipping them keeps a compromised one from running here.
            - run: npm ci --ignore-scripts
            - name: The tag matches package.json
              run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
            # Like npm publish (prepublishOnly runs the type check and tests — CI ran the ffmpeg ones on
            # this commit — and prepack compiles), but held until approved; provenance comes with it.
            - run: npm stage publish
