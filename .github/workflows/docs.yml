name: Docs

# Builds the docs site (site/, Astro Starlight) and deploys it to GitHub Pages:
# https://reelson.github.io/reelson/. One-time setup: Settings → Pages → Source: GitHub Actions.
on:
    push:
        branches: [main]
        paths: ['site/**', 'docs/**', '.github/readme/**', '.github/workflows/docs.yml']
    pull_request:
        paths: ['site/**', 'docs/**', '.github/readme/**', '.github/workflows/docs.yml']
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: docs-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build the site
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: site/package-lock.json
            - run: npm ci
              working-directory: site
            - run: npm run build
              working-directory: site
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: site/dist

    deploy:
        # Pull requests only build (a broken page fails the check); main deploys.
        name: Deploy to GitHub Pages
        needs: build
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
            - id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
