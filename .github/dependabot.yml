# Keeps the SHA-pinned actions current (a weekly PR per update, the new SHA with its version comment).
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: most malicious versions are caught and pulled by then.
      cooldown:
          default-days: 7
      groups:
          dependencies:
              patterns: ['*']
